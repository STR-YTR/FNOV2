data:
  input_dir: ../data/extrapolation/VTK
  output_dir: ../data/extrapolation/processed/pairs
  recursive: true
  file_pattern: 'case(?P<case>\d+)_(?P<step>\d+)\.vtm$'
  output_filename: pairs_case{case}_Re{Re:g}.pt
  # case numbers are local to performance/data/extrapolation.
  reynolds_by_case:
    "0": 260
    "1": 275
    "2": 300

fields:
  velocity: U
  pressure: p

time:
  step_to_time: 0.01
  min: 340.0
  max: 350.0
  dt_pair: 0.1
  tolerance: 0.000001

grid:
  bounds: auto
  nx: 256
  ny: 64
  z: null

interpolation:
  method: linear

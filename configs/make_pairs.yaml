data:
  input_dir: ../data/vtk
  output_dir: ../data/processed/pairs
  recursive: true
  file_pattern: 'case(?P<case>\d+)_(?P<step>\d+)\.vtm$'
  output_filename: pairs_case{case}_Re{Re:g}.pt
  # case0=Re10, case1=Re20, ..., case29=Re300
  reynolds_by_case:
    "0": 10
    "1": 20
    "2": 30
    "3": 40
    "4": 50
    "5": 60
    "6": 70
    "7": 80
    "8": 90
    "9": 100
    "10": 110
    "11": 120
    "12": 130
    "13": 140
    "14": 150
    "15": 160
    "16": 170
    "17": 180
    "18": 190
    "19": 200
    "20": 210
    "21": 220
    "22": 230
    "23": 240
    "24": 250
    "25": 260
    "26": 270
    "27": 280
    "28": 290
    "29": 300
fields:
  velocity: U
  pressure: p
time:
  step_to_time: 0.01
  min: 340.0
  max: 350.0
  dt_pair: 0.1
  tolerance: 0.000001
grid:
  bounds: auto  # または [xmin, xmax, ymin, ymax]
  nx: 256
  ny: 64
  z: null       # nullの場合はVTMのz方向中央
interpolation:
  method: linear

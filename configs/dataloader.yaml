# Datasetの場所・チャネル構成はdataset.yamlを正本とする。
dataset_config: dataset.yaml

# Reケース単位で分割する。同一Reを両方へ指定してはならない。
split:
  train_re:
    - 10
    - 20
    - 30
    - 40
    - 60
    - 70
    - 80
    - 90
    - 110
    - 120
    - 130
    - 140
    - 160
    - 170
    - 180
    - 190
    - 210
    - 220
    - 230
    - 240
    - 250
  val_re:
    - 50
    - 100
    - 150
    - 200

loader:
  batch_size: 8
  train_shuffle: true
  val_shuffle: false
  num_workers: 0
  pin_memory: true
  drop_last: false
  persistent_workers: false
  seed: 42
